                  document.addEventListener('DOMContentLoaded', function() {
                    (function(){
                      const mobileToggle = document.getElementById("mobile-toggle")
                      const mobileClose = document.getElementById("mobile-close")
                      const mobileOverlay = document.getElementById("mobile-overlay")

                      const openMobileMenu = () => {
                        mobileOverlay.style.display = "flex"
                        document.body.style.overflow = "hidden"
                        mobileToggle.setAttribute("aria-expanded", "true")
                      }

                      const closeMobileMenu = () => {
                        mobileOverlay.style.display = "none"
                        document.body.style.overflow = ""
                        mobileToggle.setAttribute("aria-expanded", "false")
                      }

                      mobileToggle.addEventListener("click", openMobileMenu)
                      mobileClose.addEventListener("click", closeMobileMenu)

                      // Close menu when clicking on a link
                      const mobileLinks = document.querySelectorAll(".navigation-mobile-link")
                      mobileLinks.forEach((link) => {
                        link.addEventListener("click", closeMobileMenu)
                      })

                      // Handle ESC key to close menu
                      document.addEventListener("keydown", (e) => {
                        if (e.key === "Escape" && mobileOverlay.style.display === "flex") {
                          closeMobileMenu()
                        }
                      })
                    })()

          <div class="chat-container3">
            <script defer data-name="chat-logic">
              function getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
                return null;
              }
            document.addEventListener('DOMContentLoaded', function() {
                const host = window.location.host;
                const ws = new WebSocket(`ws://${host}/ws`);
                
                // 1. 从 URL 获取初始用户名 (?name=xxx)
                const params = new URLSearchParams(window.location.search);
                let currentUsername = getCookie("username") || "匿名用户_" + Math.floor(Math.random()*1000);
                console.log("当前登录用户:", currentUsername);

                const messageList = document.getElementById("messageList");
                const messageInput = document.getElementById("messageInput");
                const chatForm = document.getElementById("chatForm");
                const nicknameText = document.getElementById("nicknameText");
                const onlineCount = document.getElementById("onlineCount");

                // 初始化界面显示
                nicknameText.textContent = currentUsername;

                ws.onopen = () => console.log("✅ WebSocket 已连接");
                ws.onerror = (err) => console.error("❌ WebSocket 错误:", err);
                ws.onclose = () => alert("会话已断开，请重新登录");

                // 3. 接收消息（处理聊天和实时人数）
                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === "count") {
                        onlineCount.textContent = data.count;
                    } else {
                        // 后端发来的是聊天消息，渲染出来
                        appendMessage(data.sender, data.content, data.created_at);
                    }
                };

                chatForm.onsubmit = (e) => {
                  e.preventDefault();
                  const text = messageInput.value.trim();
                  
                  // 确保名字不为空且 WebSocket 已连接
                  if (text && ws.readyState === WebSocket.OPEN) {
                      const payload = {
                          sender: currentUsername || "未知用户",
                          content: text,
                          type: "chat" // 明确指定类型
                      };
                      console.log("🚀 正在发送消息:", payload);
                      ws.send(JSON.stringify(payload));
                      messageInput.value = "";
                  } else {
                      console.error("❌ 无法发送：", { state: ws.readyState, text: text });
                  }
                };

                function appendMessage(user, text, time) {
                    const timeStr = time? new Date(time).toLocaleTimeString() : new Date().toLocaleTimeString();
                    const msgItem = document.createElement("div");
                    msgItem.className = "message-item";
                    // 如果是自己发的消息，颜色区分一下
                    const nameColor = (user === currentUsername)? "#B23ADE" : "#2874DE";
                    
                    msgItem.innerHTML = `
                        <div class="message-meta">
                            <span class="message-user" style="font-weight:bold; color:${nameColor}">${user}</span>
                            <span class="message-time" style="font-size:0.7em; color:#999; margin-left:10px;">${timeStr}</span>
                        </div>
                        <div class="message-content"><span>${text}</span></div>
                    `;
                    messageList.appendChild(msgItem);
                    messageList.scrollTop = messageList.scrollHeight;
                }
            });
            </script>
          </div>
        </div>
