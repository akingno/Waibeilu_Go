            <script defer data-name="chat-logic">
              function getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
                return null;
              }
            document.addEventListener('DOMContentLoaded', function() {
                const host = window.location.host;
                const ws = new WebSocket(`${window.location.protocol === "https:" ? "wss:" : "ws:"}//${host}/ws`);
                
                // 1. 从 URL 获取初始用户名 (?name=xxx)
                const params = new URLSearchParams(window.location.search);
                let currentUsername = getCookie("username") || "匿名用户_" + Math.floor(Math.random()*1000);
                console.log("当前登录用户:", currentUsername);

                const messageList = document.getElementById("messageList");
                const messageInput = document.getElementById("messageInput");
                const chatForm = document.getElementById("chatForm");
                const nicknameText = document.getElementById("nicknameText");
                const onlineCount = document.getElementById("onlineCount");
                const onlineUsersToggle = document.getElementById("onlineUsersToggle");
                const onlineUsersSidebar = document.getElementById("onlineUsersSidebar");
                const onlineUsersClose = document.getElementById("onlineUsersClose");
                const onlineUsersStatus = document.getElementById("onlineUsersStatus");
                const onlineUsersList = document.getElementById("onlineUsersList");
                const renderedMessages = new Set();

                function receiveMessage(data) {
                    const ready = window.fluentEmojiReady || Promise.resolve();
                    ready.then(() => {
                        if (data.id != null && renderedMessages.has(data.id)) return;
                        if (data.id != null) renderedMessages.add(data.id);
                        appendMessage(data.sender, data.content, data.created_at, data.image);
                    });
                }
                document.addEventListener("photo-uploaded", event => receiveMessage(event.detail));

                onlineUsersToggle.addEventListener("click", () => {
                    onlineUsersSidebar.showModal();
                    onlineUsersToggle.setAttribute("aria-expanded", "true");
                    document.body.classList.add("online-users-open");
                });
                onlineUsersClose.addEventListener("click", () => onlineUsersSidebar.close());
                onlineUsersSidebar.addEventListener("click", (event) => {
                    const bounds = onlineUsersSidebar.getBoundingClientRect();
                    if (event.target === onlineUsersSidebar &&
                        (event.clientX < bounds.left || event.clientX > bounds.right ||
                         event.clientY < bounds.top || event.clientY > bounds.bottom)) {
                        onlineUsersSidebar.close();
                    }
                });
                onlineUsersSidebar.addEventListener("close", () => {
                    onlineUsersToggle.setAttribute("aria-expanded", "false");
                    document.body.classList.remove("online-users-open");
                    onlineUsersToggle.focus();
                });

                function renderOnlineUsers(users) {
                    onlineCount.textContent = users.length;
                    onlineUsersStatus.textContent = users.length
                        ? `${users.length} 位用户在线` : "暂无在线用户";
                    const items = users.map((id) => {
                        const item = document.createElement("li");
                        item.className = "online-user-item";
                        const avatar = document.createElement("span");
                        avatar.className = "online-user-avatar";
                        avatar.setAttribute("aria-hidden", "true");
                        avatar.textContent = Array.from(id)[0]?.toUpperCase() || "?";
                        const label = document.createElement("span");
                        label.className = "online-user-id";
                        label.textContent = id;
                        item.append(avatar, label);
                        if (id === currentUsername) {
                            const badge = document.createElement("span");
                            badge.className = "online-user-self";
                            badge.textContent = "我";
                            item.appendChild(badge);
                        }
                        return item;
                    });
                    onlineUsersList.replaceChildren(...items);
                }

                function markPresenceUnavailable() {
                    onlineCount.textContent = "—";
                    onlineUsersList.replaceChildren();
                    onlineUsersStatus.textContent = "连接已断开，请刷新页面重新连接";
                }

                // 初始化界面显示
                nicknameText.textContent = currentUsername;

                ws.onopen = () => console.log("✅ WebSocket 已连接");
                ws.onerror = (err) => {
                    console.error("❌ WebSocket 错误:", err);
                    markPresenceUnavailable();
                };
                ws.onclose = markPresenceUnavailable;

                // 3. 接收消息（处理聊天和实时人数）
                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === "count") {
                        if (Array.isArray(data.users)) {
                            renderOnlineUsers(data.users);
                        } else {
                            onlineCount.textContent = data.count;
                            onlineUsersList.replaceChildren();
                            onlineUsersStatus.textContent = "在线用户列表暂不可用";
                        }
                    } else if (data.type === "chat") {
                        // 后端发来的是聊天消息，渲染出来
                        receiveMessage(data);
                    }
                };

                chatForm.onsubmit = (e) => {
                  e.preventDefault();
                  const text = messageInput.value.trim();
                  
                  // 确保名字不为空且 WebSocket 已连接
                  if (text && ws.readyState === WebSocket.OPEN) {
                      const payload = {
                          sender: currentUsername || "未知用户",
                          content: text,
                          type: "chat" // 明确指定类型
                      };
                      console.log("🚀 正在发送消息:", payload);
                      ws.send(JSON.stringify(payload));
                      messageInput.value = "";
                  } else {
                      console.error("❌ 无法发送：", { state: ws.readyState, text: text });
                  }
                };

                function appendMessage(user, text, time, image) {
                    const timeStr = time? new Date(time).toLocaleTimeString() : new Date().toLocaleTimeString();
                    const msgItem = document.createElement("div");
                    msgItem.className = "message-item";
                    // 如果是自己发的消息，颜色区分一下
                    const nameColor = (user === currentUsername)? "#B23ADE" : "#2874DE";

                    const meta = document.createElement("div");
                    meta.className = "message-meta";
                    const userElement = document.createElement("span");
                    userElement.className = "message-user";
                    userElement.style.cssText = `font-weight:bold; color:${nameColor}`;
                    userElement.textContent = user;
                    const timeElement = document.createElement("span");
                    timeElement.className = "message-time";
                    timeElement.style.cssText = "font-size:0.7em; color:#999; margin-left:10px;";
                    timeElement.textContent = timeStr;
                    meta.append(userElement, timeElement);

                    const content = document.createElement("div");
                    content.className = "message-content";
                    if (image) content.appendChild(window.chatPhotos.createThumbnail(image));
                    else appendFluentEmojiText(content, text);
                    msgItem.append(meta, content);
                    messageList.appendChild(msgItem);
                    messageList.scrollTop = messageList.scrollHeight;
                }

                function appendFluentEmojiText(container, text) {
                    const emojiMap = window.fluentEmojiMap || new Map();
                    const emojiList = [...emojiMap.keys()].sort((a, b) => b.length - a.length);
                    if (!emojiList.length) {
                        container.textContent = text;
                        return;
                    }

                    const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                    const matcher = new RegExp(`(${emojiList.map(escapeRegExp).join("|")})`, "gu");
                    for (const part of text.split(matcher)) {
                        const emoji = emojiMap.get(part) || emojiMap.get(part.replace(/\uFE0F/g, ""));
                        if (!emoji) {
                            container.appendChild(document.createTextNode(part));
                            continue;
                        }
                        const image = document.createElement("img");
                        image.className = "fluent-emoji";
                        image.src = `./vendor/fluent-emoji/flat/${emoji.slug}.svg`;
                        image.alt = part;
                        image.title = emoji.name;
                        container.appendChild(image);
                    }
                }
            });
            </script>
            <script type="module">
              import zhCN from "./vendor/emoji-picker-element/i18n/zh_CN.js";

              const picker = document.getElementById("emojiPicker");
              const emojiToggle = document.getElementById("emojiToggle");
              const messageInput = document.getElementById("messageInput");
              const emojiControl = document.querySelector(".emoji-control");

              let indicatorFrame;
              const syncPickerIndicator = () => {
                const shadowRoot = picker.shadowRoot;
                const nav = shadowRoot?.querySelector(".nav");
                const indicator = shadowRoot?.querySelector(".indicator");
                const selectedButton = nav?.querySelector('[aria-selected="true"]');
                if (!nav || !indicator || !selectedButton) return;

                const navRect = nav.getBoundingClientRect();
                const selectedRect = selectedButton.getBoundingClientRect();
                indicator.style.width = `${selectedRect.width}px`;
                indicator.style.transform = `translateX(${selectedRect.left - navRect.left}px)`;
              };

              const queuePickerIndicatorSync = () => {
                if (indicatorFrame !== undefined) cancelAnimationFrame(indicatorFrame);
                indicatorFrame = requestAnimationFrame(() => {
                  indicatorFrame = undefined;
                  syncPickerIndicator();
                });
              };

              window.fluentEmojiMap = new Map();
              window.fluentEmojiBySlug = new Map();
              window.fluentEmojiReady = (async () => {
                const catalog = await fetch("./vendor/fluent-emoji/map.json").then((response) => {
                  if (!response.ok) throw new Error(`无法加载 Fluent Emoji 数据: ${response.status}`);
                  return response.json();
                });

                for (const emoji of catalog.emojis) {
                  window.fluentEmojiMap.set(emoji.unicode, emoji);
                  window.fluentEmojiBySlug.set(emoji.slug, emoji);
                  const withoutVariationSelector = emoji.unicode.replace(/\uFE0F/g, "");
                  if (withoutVariationSelector !== emoji.unicode) {
                    window.fluentEmojiMap.set(withoutVariationSelector, emoji);
                  }
                }

                for (const emoji of catalog.variants || []) {
                  window.fluentEmojiMap.set(emoji.unicode, emoji);
                  const withoutVariationSelector = emoji.unicode.replace(/\uFE0F/g, "");
                  if (withoutVariationSelector !== emoji.unicode) {
                    window.fluentEmojiMap.set(withoutVariationSelector, emoji);
                  }
                }

                await customElements.whenDefined("emoji-picker");
                const pickerLayoutStyle = document.createElement("style");
                pickerLayoutStyle.textContent = `
                  .indicator-wrapper { position: relative; }
                  .indicator { flex: 0 0 auto; }
                `;
                picker.shadowRoot?.appendChild(pickerLayoutStyle);
                picker.i18n = zhCN;
                picker.customEmoji = catalog.emojis.map((emoji) => ({
                  name: emoji.slug,
                  shortcodes: [emoji.name, ...emoji.shortcodes],
                  url: `./vendor/fluent-emoji/flat/${emoji.slug}.svg`,
                  category: emoji.group,
                }));
                queuePickerIndicatorSync();
              })().catch((error) => {
                console.error("❌ Fluent Emoji 初始化失败:", error);
              });

              picker.addEventListener("click", queuePickerIndicatorSync);
              picker.addEventListener("keydown", queuePickerIndicatorSync);
              if (picker.shadowRoot) {
                const pickerMutationObserver = new MutationObserver(queuePickerIndicatorSync);
                pickerMutationObserver.observe(picker.shadowRoot, {
                  childList: true,
                  subtree: true,
                  attributes: true,
                  attributeFilter: ["aria-selected"],
                });
              }
              if (window.ResizeObserver) {
                new ResizeObserver(queuePickerIndicatorSync).observe(picker);
              }

              const setPickerOpen = (isOpen) => {
                picker.classList.toggle("hidden", !isOpen);
                emojiToggle.setAttribute("aria-expanded", String(isOpen));
              };

              emojiToggle.addEventListener("click", (event) => {
                event.stopPropagation();
                setPickerOpen(picker.classList.contains("hidden"));
              });

              picker.addEventListener("emoji-click", (event) => {
                const selected = event.detail;
                const emoji = selected.unicode || window.fluentEmojiBySlug.get(selected.name)?.unicode;
                if (!emoji) return;

                const start = messageInput.selectionStart;
                const end = messageInput.selectionEnd;
                messageInput.value = `${messageInput.value.slice(0, start)}${emoji}${messageInput.value.slice(end)}`;
                messageInput.focus();
                const cursorPosition = start + emoji.length;
                messageInput.setSelectionRange(cursorPosition, cursorPosition);
                setPickerOpen(false);
              });

              document.addEventListener("click", (event) => {
                if (!emojiControl.contains(event.target)) setPickerOpen(false);
              });

              document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") setPickerOpen(false);
              });
            </script>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
