    <div>
      <link href="./index.css" rel="stylesheet" />

      <div class="page1-container1">
        <navigation-wrapper class="navigation-wrapper">
          <!--Navigation component-->
          <div class="navigation-container1">
            <nav class="navigation-wrapper">
              <div class="navigation-container">
                <a href="index.html">
                  <div class="navigation-brand">

                      <svg
                        width="24"
                        xmlns="http://www.w3.org/2000/svg"
                        height="24"
                        viewBox="0 0 24 24"
                      >
                        <path
                          d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233a14 14 0 0 0 6.392 6.384"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        ></path>
                      </svg>
                    </div>
                    <span class="section-title">外北陆热线</span>
                  </div>
                </a>
                <div
                  class="navigation-thq-navigation-desktop-links-elm navigation-desktop-links"
                ></div>
                <div class="navigation-actions">
                  <a href="index.html">
                    <div class="navigation-login-btn btn-primary btn">
                      <svg
                        width="24"
                        xmlns="http://www.w3.org/2000/svg"
                        height="24"
                        viewBox="0 0 24 24"
                      >
                        <g
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"

                          <path
                            d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"
                          ></path>
                          <circle r="4" cx="12" cy="7"></circle>
                        </g>
                      </svg>
                      <span>立即登录</span>
                    </div>
                  </a>
                </div>
              </div>
            </nav>
            <div id="mobile-overlay" class="navigation-mobile-overlay">
              <div class="navigation-mobile-header">
                <a href="index.html">
                  <div class="navigation-brand">
                    <span class="section-title">外北陆热线</span>
                  </div>
                </a>
                <button
                  id="mobile-close"
                  aria-label="关闭菜单"
                  class="navigation-mobile-close"
                >
                  <svg
                    width="24"
                    xmlns="http://www.w3.org/2000/svg"
                    height="24"
                    viewBox="0 0 24 24"
                  >
                    <g
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect x="3" y="3" rx="2" width="18" height="18"></rect>
                      <path d="M3 9h18M9 16l3-3l3 3"></path>
                    </g>
                  </svg>
                </button>
              </div>
              <div class="navigation-mobile-content">
                <div class="navigation-mobile-links">
                  <a href="index.html">
                    <div class="navigation-mobile-link">
                      <span>登录首页</span>
                    </div>
                  </a>
                  <a href="register.html">
                    <div class="navigation-mobile-link">
                      <span>账号注册</span>
                    </div>
                  </a>
                  <a href="chat.html">
                    <div class="navigation-mobile-link">
                      <span>聊天室</span>
                    </div>
                  </a>
                </div>
                <div class="navigation-mobile-footer">
                  <a href="index.html">
                    <div
                      class="btn-lg btn-primary navigation-full-width-btn btn"
                    >
                      <span>开始拨打热线</span>
                    </div>
                  </a>
                </div>
              </div>
            </div>
            <div class="navigation-container2">
              <div class="navigation-container3">
                <script defer="" data-name="navigation-logic">
                  document.addEventListener('DOMContentLoaded', function() {
                    (function(){
                      const mobileToggle = document.getElementById("mobile-toggle")
                      const mobileClose = document.getElementById("mobile-close")
                      const mobileOverlay = document.getElementById("mobile-overlay")

                      const openMobileMenu = () => {
                        mobileOverlay.style.display = "flex"
                        document.body.style.overflow = "hidden"
                        mobileToggle.setAttribute("aria-expanded", "true")
                      }

                      const closeMobileMenu = () => {
                        mobileOverlay.style.display = "none"
                        document.body.style.overflow = ""
                        mobileToggle.setAttribute("aria-expanded", "false")
                      }

                      mobileToggle.addEventListener("click", openMobileMenu)
                      mobileClose.addEventListener("click", closeMobileMenu)

                      // Close menu when clicking on a link
                      const mobileLinks = document.querySelectorAll(".navigation-mobile-link")
                      mobileLinks.forEach((link) => {
                        link.addEventListener("click", closeMobileMenu)
                      })

                      // Handle ESC key to close menu
                      document.addEventListener("keydown", (e) => {
                        if (e.key === "Escape" && mobileOverlay.style.display === "flex") {
                          closeMobileMenu()
                        }
                      })
                    })()
                  });
                </script>
              </div>
            </div>
          </div>
        </navigation-wrapper>
        <section class="-----welcome-hero">
          <div class="welcome-hero-container">
            <div class="welcome-hero-card">
              <h1 class="-----hero-title1 welcome-hero-title hero-title">
                欢迎拨打外北陆热线
              </h1>
            </div>
          </div>
        </section>
        <section class="login-form-section">
          <div class="login-form-container">
            <div class="login-form-card">
              <h2 class="login-form-title section-title">账号登录</h2>
              <form
                action="/api/login"
                method="POST"
                id="loginForm"
                data-form-id="fbe15aae-c817-422a-b778-c1cb3b8511c1"
                class="login-form-element"
              >
                <div class="form-group">
                  <label for="username" class="form-label">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"
                      ></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>账号</span>
                  </label>
                  <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required="true"
                    minlength="2"
                    placeholder="请输入您的账号"
                    data-form-field-id="username"
                    class="-----form-input"
                  />
                </div>
                <div class="form-group">
                  <label for="password" class="form-label">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect
                        width="18"
                        height="11"
                        x="3"
                        y="11"
                        rx="2"
                        ry="2"
                      ></rect>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>密码</span>
                  </label>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required="true"
                    minlength="6"
                    placeholder="请输入您的密码"
                    data-form-field-id="password"
                    class="-----form-input"
                  />
                </div>
                <div class="form-actions">
                  <button
                    type="submit"
                    id="thq_button_sxWh"
                    name="button"
                    data-form-field-id="thq_button_sxWh"
                    class="-----btn-primary1 login-btn btn btn-primary"
                  >
                    登录
                  </button>
                  <button
                    type="button"
                    id="navRegister"
                    name="button"
                    data-form-field-id="navRegister"
                    class="-----btn-outline1 register-btn btn btn-outline"
                  >
                    注册
                  </button>
                </div>
              </form>
            </div>
          </div>
        </section>
        <section class="status-alert-section">
          <div class="status-alert-container">
            <div
              id="statusAlert"
              role="alert"
              aria-live="polite"
              class="status-alert-box"
            >
              <div class="status-alert-content">
                <div class="status-icon-wrapper">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"

                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 8v4m0 4h.01"></path>
                  </svg>
                </div>
                <div class="status-text-content">
                  <p class="status-message section-content">
                    请填写账号和密码以继续登录。
                  </p>
                </div>
              </div>
            </div>
          </div>
        </section>
        <div class="page1-container2">
          <div class="page1-container3">
            <script defer data-name="login-logic">
              document.addEventListener('DOMContentLoaded', function() {
                const loginForm = document.getElementById("loginForm");
                const navRegister = document.getElementById("navRegister");

                // 修复跳转：点击注册按钮跳转到注册页面
                if (navRegister) {
                  navRegister.addEventListener("click", () => {
                    window.location.href = "/register.html";
                  });
                }

                if (loginForm) {
                  loginForm.addEventListener("submit", () => {
                    const submitBtn = loginForm.querySelector(".login-btn");
                    submitBtn.disabled = true;
                    submitBtn.textContent = "正在连接服务器...";
                  });
                }
              });
            </script>
          </div>
        </div>
      </div>
    </div>
