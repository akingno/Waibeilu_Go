            <div class="navigation-container2">
              <div class="navigation-container3">
                <script defer="" data-name="navigation-logic">
                  document.addEventListener('DOMContentLoaded', function() {
                    (function(){
                      const mobileToggle = document.getElementById("mobile-toggle")
                      const mobileClose = document.getElementById("mobile-close")
                      const mobileOverlay = document.getElementById("mobile-overlay")

                      const openMobileMenu = () => {
                        mobileOverlay.style.display = "flex"
                        document.body.style.overflow = "hidden"
                        mobileToggle.setAttribute("aria-expanded", "true")
                      }

                      const closeMobileMenu = () => {
                        mobileOverlay.style.display = "none"
                        document.body.style.overflow = ""
                        mobileToggle.setAttribute("aria-expanded", "false")
                      }

                      mobileToggle.addEventListener("click", openMobileMenu)
                      mobileClose.addEventListener("click", closeMobileMenu)

                      // Close menu when clicking on a link
                      const mobileLinks = document.querySelectorAll(".navigation-mobile-link")
                      mobileLinks.forEach((link) => {
                        link.addEventListener("click", closeMobileMenu)
                      })

                      // Handle ESC key to close menu
                      document.addEventListener("keydown", (e) => {
                        if (e.key === "Escape" && mobileOverlay.style.display === "flex") {
                          closeMobileMenu()
                        }
                      })
                    })()
                  });
                </script>
              </div>
            </div>

        <main class="registration-page">
            <section class="form-section">
                <div class="form-container">
                    <div class="form-modal">
                        <h1 class="hero-title">外北陆热线 - 注册</h1>
                        <form action="/api/register" method="POST" id="registrationForm">
                            <div class="input-group">
                                <label class="section-content">账号</label>
                                <div class="input-wrapper">
                                    <input type="text" id="username" name="username" required minlength="2" maxlength="32" placeholder="请输入您的账号" class="form-input" />
                                </div>
                            </div>
                            <div class="input-group">
                                <label class="section-content">密码</label>
                                <div class="input-wrapper">
                                    <input type="password" name="password" id="password" required minlength="6" placeholder="请输入密码" class="form-input" />
                                </div>
                            </div>
                            <div class="input-group">
                                <label class="section-content">再次输入密码</label>
                                <div class="input-wrapper">
                                    <input type="password" id="confirm-password" required placeholder="请再次输入密码" class="form-input" />
                                </div>
                            </div>
                            <div class="button-row">
                                <button type="submit" class="btn btn-primary btn-lg">确认注册</button>
                                <a href="/" class="btn btn-outline btn-lg">返回登录</a>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
        <script>
              // 仅保留两次密码一致性校验
              document.getElementById("registrationForm").onsubmit = function(e) {
                  const p1 = document.getElementById("password").value;
                  const p2 = document.getElementById("confirm-password").value;
                  if (p1!== p2) {
                      alert("两次输入的密码不一致！");
                      e.preventDefault();
                      return false;
                  }
                  return true;
              };
          </script>

        <div class="register-container4">
          <div class="register-container5">
            <script defer="" data-name="registration-logic">
              document.addEventListener('DOMContentLoaded', function() {
                (function(){
                  const form = document.getElementById("registrationForm")
                  const usernameInput = document.getElementById("username")
                  const passwordInput = document.getElementById("password")
                  const confirmInput = document.getElementById("confirm-password")

                  const ruleLength = document.getElementById("rule-length")
                  const ruleMatch = document.getElementById("rule-match")
                  const ruleUsername = document.getElementById("rule-username")

                  const alertBox = document.getElementById("registration-alert")
                  const alertTitle = document.getElementById("alert-title")
                  const alertMessage = document.getElementById("alert-message")
                  const iconSuccess = document.getElementById("alert-icon-success")
                  const iconError = document.getElementById("alert-icon-error")
                  const closeAlert = document.getElementById("close-alert")

                  const validate = () => {
                    const userVal = usernameInput.value
                    const passVal = passwordInput.value
                    const confirmVal = confirmInput.value

                    if (userVal.trim().length >= 2) {
                      ruleUsername.classList.add("is-valid")
                    } else {
                      ruleUsername.classList.remove("is-valid")
                    }

                    if (passVal.length >= 6) {
                      ruleLength.classList.add("is-valid")
                    } else {
                      ruleLength.classList.remove("is-valid")
                    }

                    if (confirmVal.length > 0 && passVal === confirmVal) {
                      ruleMatch.classList.add("is-valid")
                    } else {
                      ruleMatch.classList.remove("is-valid")
                    }
                  }

                  usernameInput.addEventListener("input", validate)
                  passwordInput.addEventListener("input", validate)
                  confirmInput.addEventListener("input", validate)

                  form.addEventListener("submit", (e) => {
                    const isUserValid = usernameInput.value.trim().length >= 2
                    const isPassValid = passwordInput.value.length >= 6
                    const isMatchValid = passwordInput.value === confirmInput.value

                    if (!isUserValid || !isPassValid || !isMatchValid) {
                      e.preventDefault()
                      alertBox.hidden = false
                      alertTitle.textContent = "注册失败"
                      alertMessage.textContent = "请检查表单中的错误。确保账号至少2位，密码至少6位且两次输入一致。"
                      iconSuccess.hidden = true
                      iconError.hidden = false
                      alertBox.style.borderColor = "#e74c3c"
                      alertBox.scrollIntoView({ behavior: "smooth", block: "center" })
                      return
                    }

                    const submitButton = form.querySelector('button[type="submit"]')
                    if (submitButton) {
                      submitButton.disabled = true
                      submitButton.textContent = "正在创建账号..."
                    }
                  })

                  closeAlert.addEventListener("click", () => {
                    alertBox.hidden = true
                  })
                })()
              });
            </script>
          </div>
        </div>
