                    (function(){
                      const mobileToggle = document.getElementById("mobile-toggle")
                      const mobileClose = document.getElementById("mobile-close")
                      const mobileOverlay = document.getElementById("mobile-overlay")

                      const openMobileMenu = () => {
                        mobileOverlay.style.display = "flex"
                        document.body.style.overflow = "hidden"
                        mobileToggle.setAttribute("aria-expanded", "true")
                      }

                      const closeMobileMenu = () => {
                        mobileOverlay.style.display = "none"
                        document.body.style.overflow = ""
                        mobileToggle.setAttribute("aria-expanded", "false")
                      }

                      mobileToggle.addEventListener("click", openMobileMenu)
                      mobileClose.addEventListener("click", closeMobileMenu)

                      // Close menu when clicking on a link
                      const mobileLinks = document.querySelectorAll(".navigation-mobile-link")
                      mobileLinks.forEach((link) => {
                        link.addEventListener("click", closeMobileMenu)
                      })

                      // Handle ESC key to close menu
                      document.addEventListener("keydown", (e) => {
                        if (e.key === "Escape" && mobileOverlay.style.display === "flex") {
                          closeMobileMenu()
                        }
                      })

            <script defer="" data-name="chat-logic">
              document.addEventListener('DOMContentLoaded', function() {
                (function(){
                  const nicknameText = document.getElementById("nicknameText")
                  const nicknameInput = document.getElementById("nicknameInput")
                  const nicknameDisplayWrapper = document.getElementById("nicknameDisplayWrapper")
                  const nicknameEditWrapper = document.getElementById("nicknameEditWrapper")
                  const saveNicknameBtn = document.getElementById("saveNicknameBtn")
                  const cancelNicknameBtn = document.getElementById("cancelNicknameBtn")

                  const messageList = document.getElementById("messageList")
                  const messageInput = document.getElementById("messageInput")
                  const chatForm = document.getElementById("chatForm")
                  const typingIndicator = document.getElementById("typingIndicator")

                  const fontSizeSelect = document.getElementById("fontSizeSelect")
                  const showTimeToggle = document.getElementById("showTimeToggle")

                  nicknameText.addEventListener("click", () => {
                    nicknameInput.value = nicknameText.textContent
                    nicknameDisplayWrapper.classList.add("hidden")
                    nicknameEditWrapper.classList.remove("hidden")
                    nicknameInput.focus()
                  })

                  const closeEdit = () => {
                    nicknameDisplayWrapper.classList.remove("hidden")
                    nicknameEditWrapper.classList.add("hidden")
                  }

                  saveNicknameBtn.addEventListener("click", () => {
                    if (nicknameInput.value.trim()) {
                      nicknameText.textContent = nicknameInput.value.trim()
                    }
                    closeEdit()
                  })

                  cancelNicknameBtn.addEventListener("click", closeEdit)

                  const scrollToBottom = () => {
                    messageList.scrollTop = messageList.scrollHeight
                  }

                  const addMessage = (user, text) => {
                    const now = new Date()
                    const timeStr = now.toTimeString().split(" ")[0]

                    const msgItem = document.createElement("div")
                    msgItem.className = "message-item"

                    const meta = document.createElement("div")
                    meta.className = "message-meta"

                    const userSpan = document.createElement("span")
                    userSpan.className = "message-user"
                    userSpan.textContent = user

                    const timeSpan = document.createElement("span")
                    timeSpan.className = "message-time"
                    timeSpan.textContent = timeStr
                    if (!showTimeToggle.checked) timeSpan.classList.add("hidden")

                    const content = document.createElement("div")
                    content.className = "message-content"
                    content.textContent = text

                    meta.appendChild(userSpan)
                    meta.appendChild(timeSpan)
                    msgItem.appendChild(meta)
                    msgItem.appendChild(content)

                    messageList.appendChild(msgItem)
                    scrollToBottom()
                  }

                  chatForm.addEventListener("submit", (e) => {
                    const text = messageInput.value.trim()
                    if (text) {
                      addMessage(nicknameText.textContent, text)
                      messageInput.value = ""
                      typingIndicator.classList.add("hidden")
                    }
                  })

                  messageInput.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && !e.shiftKey) {
                      e.preventDefault()
                      chatForm.dispatchEvent(new Event("submit"))
                    }
                  })

                  let typingTimeout
                  messageInput.addEventListener("input", () => {
                    typingIndicator.classList.remove("hidden")
                    clearTimeout(typingTimeout)
                    typingTimeout = setTimeout(() => {
                      typingIndicator.classList.add("hidden")
                    }, 2000)
                  })

                  fontSizeSelect.addEventListener("change", (e) => {
                    const size = e.target.value
                    if (size === "small") {
                      messageList.style.fontSize = "var(--font-size-base)"
                    } else if (size === "medium") {
                      messageList.style.fontSize = "var(--font-size-lg)"
                    } else if (size === "large") {
                      messageList.style.fontSize = "var(--font-size-xl)"
                    }
                  })

                  showTimeToggle.addEventListener("change", (e) => {
                    const times = document.querySelectorAll(".message-time")
                    times.forEach((t) => {
                      if (e.target.checked) t.classList.remove("hidden")
                      else t.classList.add("hidden")
                    })
                  })

                  scrollToBottom()
                })()
              });
            </script>
